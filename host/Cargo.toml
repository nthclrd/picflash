[package]
name = "picflash"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "PIC ICSP programmer host tool (replaces MPLAB IPE for supported parts)"

[dependencies]
picflash-protocol = { path = "../protocol" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ihex = "3.0.0"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
flate2 = "1.1.10"
serialport = { version = "4.10.1", default-features = false }
nusb = "0.2.8"
